<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sakura River</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D scene: a cherry blossom tree beside a river flowing from a snow-capped mountain"></canvas>

<div class="brand" aria-hidden="false">
  <div class="brand-title">桜川</div>
  <div class="brand-meta">
    <div class="seal" aria-hidden="true">春</div>
    <div class="brand-name">Sakura River</div>
    <div class="brand-sub">An evening in spring, beneath the mountain</div>
    <div class="brand-hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  </div>
</div>

<div class="top-right">
  <span class="stats" id="stats"></span>
  <button type="button" class="btn icon" id="btn-full" aria-label="Enter full screen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
  </button>
  <button type="button" class="btn icon" id="btn-ui" aria-label="Hide controls" aria-pressed="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>
</div>

<div class="bar" id="bar">
  <div class="sliders">
    <label class="ctl" for="s-wind"><span class="ctl-head"><span class="ctl-name"><span class="kanji">風</span><span class="label">Wind</span></span><span class="val" id="v-wind"></span></span><input type="range" id="s-wind" min="0" max="100" step="1" value="38"></label>
    <label class="ctl" for="s-petals"><span class="ctl-head"><span class="ctl-name"><span class="kanji">花</span><span class="label">Petals</span></span><span class="val" id="v-petals"></span></span><input type="range" id="s-petals" min="0" max="100" step="1" value="60"></label>
    <label class="ctl" for="s-river"><span class="ctl-head"><span class="ctl-name"><span class="kanji">川</span><span class="label">River</span></span><span class="val" id="v-river"></span></span><input type="range" id="s-river" min="0" max="100" step="1" value="45"></label>
    <label class="ctl" for="s-time"><span class="ctl-head"><span class="ctl-name"><span class="kanji">刻</span><span class="label">Time</span></span><span class="val" id="v-time"></span></span><input type="range" id="s-time" min="0" max="100" step="1" value="92"></label>
    <label class="ctl" for="s-fog"><span class="ctl-head"><span class="ctl-name"><span class="kanji">霞</span><span class="label">Mist</span></span><span class="val" id="v-fog"></span></span><input type="range" id="s-fog" min="0" max="100" step="1" value="25"></label>
    <label class="ctl" for="s-bloom"><span class="ctl-head"><span class="ctl-name"><span class="kanji">光</span><span class="label">Glow</span></span><span class="val" id="v-bloom"></span></span><input type="range" id="s-bloom" min="0" max="100" step="1" value="40"></label>
  </div>
  <div class="divider"></div>
  <div class="actions">
    <button type="button" class="btn" id="btn-cine" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
      <span class="act-label">Cinematic</span>
    </button>
    <button type="button" class="btn" id="btn-orbit" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="4.5"></ellipse><circle cx="12" cy="12" r="2"></circle><path d="M19 8.2l2.2-.4-.6 2.2"></path></svg>
      <span class="act-label">Orbit</span>
    </button>
    <button type="button" class="btn" id="btn-reset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
      <span class="act-label">Reset view</span>
    </button>
  </div>
</div>

<div class="veil" id="veil" role="status">
  <div class="veil-mark" aria-hidden="true">桜</div>
  <div class="veil-text" id="veil-text">Growing the blossoms…</div>
</div>

<script type="module" src="/src/ui.js"></script>
</body>
</html>
