<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sakura River</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Cg fill='%23f5a9c1' stroke='%23c9486e' stroke-width='3'%3E%3Cg transform='rotate(0)'%3E%3Cpath d='M0 0C-21-10-21-36-8-44L0-37 8-44C21-36 21-10 0 0Z'/%3E%3C/g%3E%3Cg transform='rotate(72)'%3E%3Cpath d='M0 0C-21-10-21-36-8-44L0-37 8-44C21-36 21-10 0 0Z'/%3E%3C/g%3E%3Cg transform='rotate(144)'%3E%3Cpath d='M0 0C-21-10-21-36-8-44L0-37 8-44C21-36 21-10 0 0Z'/%3E%3C/g%3E%3Cg transform='rotate(216)'%3E%3Cpath d='M0 0C-21-10-21-36-8-44L0-37 8-44C21-36 21-10 0 0Z'/%3E%3C/g%3E%3Cg transform='rotate(288)'%3E%3Cpath d='M0 0C-21-10-21-36-8-44L0-37 8-44C21-36 21-10 0 0Z'/%3E%3C/g%3E%3C/g%3E%3Ccircle r='7' fill='%23c9486e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without holding back the first paint (the loading veil shows at once, in a fallback font if need be) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D scene: a cherry blossom tree beside a river flowing from a snow-capped mountain"></canvas>

<div class="brand" aria-hidden="false">
  <div class="brand-title">桜川</div>
  <div class="brand-meta">
    <div class="seal" aria-hidden="true">春</div>
    <div class="brand-name">Sakura River</div>
  </div>
</div>

<div class="top-right">
  <span class="stats" id="stats" hidden></span>
  <button type="button" class="btn icon" id="btn-link" aria-label="Copy a link to this view" title="Copy a link to this view">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"></path><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"></path></svg>
  </button>
  <button type="button" class="btn icon" id="btn-photo" aria-pressed="false" aria-label="Hide the controls" title="Hide the controls (H)" aria-keyshortcuts="H">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8V5.5a2 2 0 0 1 2-2H8M16 3.5h2.5a2 2 0 0 1 2 2V8M20.5 16v2.5a2 2 0 0 1-2 2H16M8 20.5H5.5a2 2 0 0 1-2-2V16"></path><circle cx="12" cy="12" r="3.2"></circle></svg>
  </button>
  <button type="button" class="btn icon" id="btn-sound" aria-pressed="true" aria-label="Mute sound" title="Music and ambience">
    <svg class="i-on" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"></path></svg>
    <svg class="i-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M16 9.5l5 5M21 9.5l-5 5"></path></svg>
  </button>
  <button type="button" class="btn icon" id="btn-full" aria-label="Enter full screen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
  </button>
</div>

<div class="side" id="side">
  <div class="actions">
    <label class="quality" title="Rendering quality (changing it reloads the scene)">
      <select id="quality" aria-label="Rendering quality">
        <option value="auto">Auto</option>
        <option value="ultra" title="For strong GPUs: supersampled, the most detail; ignores the frame budget">Ultra</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label class="quality rate" title="Frame rate: Auto runs at 60 and drops to 30 on a slow device before it lowers any detail">
      <select id="rate" aria-label="Frame rate">
        <option value="auto">Auto · fps</option>
        <option value="60">60 fps</option>
        <option value="30">30 fps</option>
      </select>
    </label>
    <button type="button" class="btn icon" id="btn-cine" aria-pressed="false" aria-label="Cinematic" title="Cinematic">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="12" height="10" rx="2"></rect><path d="M15 10.5l5-3v9l-5-3z"></path></svg>
    </button>
    <button type="button" class="btn icon" id="btn-orbit" aria-pressed="false" aria-label="Orbit" title="Orbit">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.8"></circle><path d="M19.94 8.95A8.5 8.5 0 1 1 15.05 4.06"></path><circle cx="18.01" cy="5.99" r="1.8" fill="currentColor"></circle></svg>
    </button>
    <button type="button" class="btn icon" id="btn-walk" aria-pressed="false" aria-label="Walk" title="Walk">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.2" cy="4.3" r="1.9"></circle><path d="M12.6 8.4l-1.1 6"></path><path d="M11.5 14.4l-2.2 3.3-1.6 3.6"></path><path d="M11.5 14.4l2.4 3 1 3.9"></path><path d="M12.4 9.6l-2.8 3.1M12.4 9.6l3 2.6"></path></svg>
    </button>
    <button type="button" class="btn icon" id="btn-reset" aria-label="Reset view" title="Reset view">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path><path d="M4.5 3.5v4h4"></path></svg>
    </button>
  </div>
  <section class="panel" aria-label="Scene controls">
    <div class="group">
      <div class="label"><span id="w-label">Weather</span>
        <span class="clock-wrap"><output id="w-name"></output>
          <button type="button" class="mini" id="w-random" aria-label="Random weather" title="Random weather">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"></rect><circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15" cy="15" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15" cy="9" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="9" cy="15" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle></svg>
          </button>
        </span>
      </div>
      <div class="seg" id="weathers" role="group" aria-labelledby="w-label"></div>
    </div>
    <div class="group">
      <div class="label"><span id="t-label">Time</span>
        <span class="clock-wrap"><output id="clock"></output>
          <button type="button" class="mini" id="t-random" aria-label="Random time" title="Random time">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"></rect><circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15" cy="15" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15" cy="9" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="9" cy="15" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle></svg>
          </button>
        </span>
      </div>
      <div class="seg" id="times" role="group" aria-labelledby="t-label"></div>
      <input type="range" class="day" id="t-day" min="0" max="23.5" step="any" aria-label="Time of day" title="Time of day">
    </div>
    <div class="group">
      <div class="label"><span id="s-label">Sound</span></div>
      <div class="mix" role="group" aria-labelledby="s-label">
        <label class="vol"><b lang="ja">楽</b><span>Music</span><input type="range" id="v-music" min="0" max="1" step="0.01" aria-label="Music volume"></label>
        <label class="vol"><b lang="ja">音</b><span>Nature</span><input type="range" id="v-nature" min="0" max="1" step="0.01" aria-label="Nature sound volume"></label>
      </div>
    </div>
  </section>
</div>

<div class="hint" id="walk-hint">W A S D walk · mouse look · Shift hurry · Esc frees the mouse, Esc again leaves</div>
<div class="hint" id="toast" role="status" aria-live="polite"></div>

<button type="button" class="btn" id="photo-exit" aria-keyshortcuts="H Escape" title="Show the controls (H or Esc)">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>
  Show controls
</button>

<div class="notice" id="notice" role="status" hidden>
  <span id="notice-text"></span>
  <button type="button" class="btn" id="notice-low" hidden>Switch to Low</button>
  <button type="button" class="mini" id="notice-close" aria-label="Dismiss">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
</div>

<div class="veil" id="veil" role="status">
  <div class="veil-mark" aria-hidden="true">桜</div>
  <div class="veil-text" id="veil-text">Growing the blossoms…</div>
  <div class="veil-sub" id="veil-sub"></div>
  <div class="veil-actions" id="veil-actions"></div>
</div>

<script type="module" src="/src/ui.js"></script>
</body>
</html>
