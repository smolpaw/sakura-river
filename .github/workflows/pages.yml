# Builds the single-file page, checks that the scene starts in it, and publishes dist/ to GitHub Pages on every push to
# main. A build whose scene does not start (bench/check-dist.mjs) is not published.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # the built site headless in the runner's Chrome, on the WebGL2 fallback in SwiftShader (no GPU here: slow)
      - name: Check that the scene starts
        run: node bench/check-dist.mjs
        env:
          CHROME: /usr/bin/google-chrome
        timeout-minutes: 20
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
