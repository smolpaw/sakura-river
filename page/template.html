<title>Sakura River</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0e0c14;
    --washi: #f4efe6;
    --washi-dim: rgba(244, 239, 230, 0.72);
    --line: rgba(244, 239, 230, 0.16);
    --glass: rgba(16, 13, 22, 0.56);
    --sakura: #f5c3d0;
    --shu: #c8372d;
    --shu-on: rgba(200, 55, 45, 0.55);
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--washi); overflow: hidden;
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .brand { position: fixed; top: calc(22px + env(safe-area-inset-top, 0px)); left: 24px; display: flex; gap: 14px;
    align-items: flex-start; pointer-events: none; text-shadow: 0 1px 12px rgba(20, 12, 30, 0.45); }
  .brand-title { writing-mode: vertical-rl; font-family: 'Shippori Mincho', 'Yu Mincho', serif; font-weight: 700;
    font-size: 44px; letter-spacing: 0.14em; line-height: 1; color: #fbf6ee; }
  .brand-meta { display: flex; flex-direction: column; gap: 9px; padding-top: 4px; }
  .seal { width: 30px; height: 30px; border-radius: 4px; background: var(--shu); color: #fff3ea; display: grid; place-items: center;
    font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 17px; box-shadow: inset 0 0 0 2px rgba(255, 236, 226, 0.35); text-shadow: none; }
  .brand-name { font-family: 'Shippori Mincho', serif; font-size: 15px; letter-spacing: 0.3em; text-transform: uppercase; color: #fbf6ee; }
  .brand-sub { font-size: 12px; letter-spacing: 0.04em; color: rgba(251, 246, 238, 0.82); }
  .brand-hint { font-size: 11px; letter-spacing: 0.06em; color: rgba(251, 246, 238, 0.66); margin-top: 6px; }

  .top-right { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: 18px; display: flex; align-items: center; gap: 8px; }
  .stats { font-size: 11px; letter-spacing: 0.08em; color: var(--washi-dim); font-variant-numeric: tabular-nums; text-shadow: 0 1px 8px rgba(20, 12, 30, 0.5); }

  .btn { height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(244, 239, 230, 0.06);
    color: var(--washi); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    font: inherit; font-size: 12px; letter-spacing: 0.08em; white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .btn.icon { padding: 0; width: 44px; background: rgba(18, 15, 24, 0.42); }
  .btn:hover { background: rgba(244, 239, 230, 0.14); }
  .btn:focus-visible { outline: 2px solid #f7d3dd; outline-offset: 2px; }
  .btn[aria-pressed="true"] { background: var(--shu-on); border-color: rgba(247, 211, 221, 0.6); }
  .btn svg { flex: none; }

  .bar { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(1200px, calc(100% - 32px)); box-sizing: border-box; padding: 14px 18px; display: flex; align-items: center; gap: 20px;
    background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25);
    border: 1px solid rgba(244, 239, 230, 0.14); border-radius: 18px; box-shadow: 0 18px 50px rgba(8, 5, 14, 0.35);
    transition: opacity 0.35s ease, transform 0.35s ease; }
  .ui-hidden .bar { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  .ui-hidden .brand, .ui-hidden .stats { opacity: 0; }
  .brand, .stats { transition: opacity 0.35s ease; }

  .sliders { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; flex: 1 1 auto; min-width: 0; }
  .ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ctl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .ctl-name { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .kanji { font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 16px; color: var(--sakura); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(244, 239, 230, 0.86); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--washi-dim); }
  .divider { width: 1px; align-self: stretch; background: var(--line); }
  .actions { display: flex; gap: 8px; align-items: center; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: rgba(244, 239, 230, 0.28); }
  input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: rgba(244, 239, 230, 0.28); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%;
    background: #f7d3dd; border: 2px solid var(--shu); box-shadow: 0 0 0 3px rgba(242, 183, 198, 0.18); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #f7d3dd; border: 2px solid var(--shu); }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(247, 211, 221, 0.6); }

  .veil { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #120f18; transition: opacity 0.9s ease; z-index: 5; }
  .veil.done { opacity: 0; pointer-events: none; }
  .veil-mark { font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 56px; color: var(--sakura); animation: breathe 2.4s ease-in-out infinite; }
  .veil-text { font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--washi-dim); text-align: center; padding-inline: 16px; }
  @keyframes breathe { 50% { opacity: 0.55; transform: scale(0.96); } }
  @media (prefers-reduced-motion: reduce) { .veil-mark { animation: none; } .bar, .veil { transition: none; } }

  @media (max-width: 1000px) {
    .bar { flex-direction: column; align-items: stretch; gap: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .sliders { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .divider { display: none; }
    .actions { justify-content: center; flex-wrap: wrap; }
  }
  @media (max-width: 560px) {
    .sliders { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
    .bar { padding: 12px 14px; }
    .brand-title { font-size: 32px; }
    .brand-sub, .brand-hint, .stats { display: none; }
    .act-label { display: none; }
    .brand { left: 16px; }
  }
</style>

<canvas id="scene" aria-label="Interactive 3D scene: a cherry blossom tree beside a river flowing from a snow-capped mountain"></canvas>

<div class="brand" aria-hidden="false">
  <div class="brand-title">桜川</div>
  <div class="brand-meta">
    <div class="seal" aria-hidden="true">春</div>
    <div class="brand-name">Sakura River</div>
    <div class="brand-sub">An evening in spring, beneath the mountain</div>
    <div class="brand-hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  </div>
</div>

<div class="top-right">
  <span class="stats" id="stats"></span>
  <button type="button" class="btn icon" id="btn-full" aria-label="Enter full screen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
  </button>
  <button type="button" class="btn icon" id="btn-ui" aria-label="Hide controls" aria-pressed="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>
</div>

<div class="bar" id="bar">
  <div class="sliders">
    <label class="ctl" for="s-wind"><span class="ctl-head"><span class="ctl-name"><span class="kanji">風</span><span class="label">Wind</span></span><span class="val" id="v-wind"></span></span><input type="range" id="s-wind" min="0" max="100" step="1" value="38"></label>
    <label class="ctl" for="s-petals"><span class="ctl-head"><span class="ctl-name"><span class="kanji">花</span><span class="label">Petals</span></span><span class="val" id="v-petals"></span></span><input type="range" id="s-petals" min="0" max="100" step="1" value="60"></label>
    <label class="ctl" for="s-river"><span class="ctl-head"><span class="ctl-name"><span class="kanji">川</span><span class="label">River</span></span><span class="val" id="v-river"></span></span><input type="range" id="s-river" min="0" max="100" step="1" value="45"></label>
    <label class="ctl" for="s-time"><span class="ctl-head"><span class="ctl-name"><span class="kanji">刻</span><span class="label">Time</span></span><span class="val" id="v-time"></span></span><input type="range" id="s-time" min="0" max="100" step="1" value="92"></label>
    <label class="ctl" for="s-fog"><span class="ctl-head"><span class="ctl-name"><span class="kanji">霞</span><span class="label">Mist</span></span><span class="val" id="v-fog"></span></span><input type="range" id="s-fog" min="0" max="100" step="1" value="25"></label>
    <label class="ctl" for="s-bloom"><span class="ctl-head"><span class="ctl-name"><span class="kanji">光</span><span class="label">Glow</span></span><span class="val" id="v-bloom"></span></span><input type="range" id="s-bloom" min="0" max="100" step="1" value="40"></label>
  </div>
  <div class="divider"></div>
  <div class="actions">
    <button type="button" class="btn" id="btn-cine" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
      <span class="act-label">Cinematic</span>
    </button>
    <button type="button" class="btn" id="btn-orbit" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="4.5"></ellipse><circle cx="12" cy="12" r="2"></circle><path d="M19 8.2l2.2-.4-.6 2.2"></path></svg>
      <span class="act-label">Orbit</span>
    </button>
    <button type="button" class="btn" id="btn-reset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
      <span class="act-label">Reset view</span>
    </button>
  </div>
</div>

<div class="veil" id="veil" role="status">
  <div class="veil-mark" aria-hidden="true">桜</div>
  <div class="veil-text" id="veil-text">Growing the blossoms…</div>
</div>

<script>/*__ENGINE__*/</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var keys = ['wind', 'petals', 'river', 'time', 'fog', 'bloom'];
  var engine = null;
  function clock(v) {
    var m = Math.round((5 + 14 * v / 100) * 60), hh = Math.floor(m / 60), mm = m % 60;
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function show(k) { var v = +$('s-' + k).value; $('v-' + k).textContent = k === 'time' ? clock(v) : String(v); }
  keys.forEach(function (k) {
    show(k);
    $('s-' + k).addEventListener('input', function () { show(k); if (engine) engine.set(k, +this.value / 100); });
  });
  function setPressed(btn, on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }

  $('btn-cine').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    setPressed(this, on); if (engine) engine.setCinematic(on);
  });
  $('btn-orbit').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    setPressed(this, on); if (engine) engine.setAutoOrbit(on);
  });
  $('btn-reset').addEventListener('click', function () {
    setPressed($('btn-cine'), false); if (engine) engine.resetCamera();
  });
  $('btn-ui').addEventListener('click', function () {
    var hide = !document.body.classList.contains('ui-hidden');
    document.body.classList.toggle('ui-hidden', hide);
    setPressed(this, hide);
    this.setAttribute('aria-label', hide ? 'Show controls' : 'Hide controls');
  });
  var fullBtn = $('btn-full');
  var canFull = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if (!canFull) fullBtn.hidden = true;
  fullBtn.addEventListener('click', function () {
    var d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
      else {
        var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        if (p && p.catch) p.catch(function () { fullBtn.hidden = true; });
      }
    } catch (e) { fullBtn.hidden = true; }
  });
  document.addEventListener('fullscreenchange', function () {
    fullBtn.setAttribute('aria-label', document.fullscreenElement ? 'Exit full screen' : 'Enter full screen');
  });

  function start() {
    try {
      engine = window.SakuraRiver.create($('scene'), {
        onStats: function (s) { $('stats').textContent = s.fps + ' fps · ' + s.quality; },
        onCinematicChange: function (on) { setPressed($('btn-cine'), on); },
      });
      keys.forEach(function (k) { engine.setImmediate(k, +$('s-' + k).value / 100); });
      $('veil').classList.add('done');
    } catch (e) {
      $('veil-text').textContent = 'This device could not start WebGL. Try a desktop browser with hardware acceleration on.';
    }
  }
  // let the veil paint before the procedural build
  requestAnimationFrame(function () { setTimeout(start, 30); });
})();
</script>
